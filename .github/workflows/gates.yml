name: Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run check:gates --base origin/${{ github.base_ref }}
      - run: bun run scripts/checkPathsCli.ts --base origin/${{ github.base_ref }}
