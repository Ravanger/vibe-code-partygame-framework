name: Setup
description: Install bun and the locked dependencies with a cached download directory
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json', 'packages/*/src/**', 'packages/*/package.json', 'games/*/src/**', 'games/*/ui/**', 'games/*/package.json') }}
        restore-keys: turbo-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
